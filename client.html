<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אזור אישי - פריד משכנתאות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; }
        .premium-bg { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .premium-text { color: #1e3a8a; }
        .gold-accent { color: #d97706; }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <!-- מסך כניסת לקוח -->
    <div id="client-login" class="max-w-md w-full bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-blue-900">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold premium-text">אזור אישי ללקוח</h1>
            <p class="text-gray-500 mt-2">הזן את הפרטים שקיבלת מהיועץ</p>
        </div>
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">מספר טלפון</label>
                <input type="tel" id="loginPhone" placeholder="05X-XXXXXXX" class="w-full border p-4 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 outline-none transition text-lg text-center">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">קוד תיק אישי (מספר גישה)</label>
                <input type="text" id="loginCode" placeholder="לדוגמה: aBcD123" class="w-full border p-4 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 outline-none transition text-lg text-center" dir="ltr">
            </div>
            <button onclick="fetchClientData()" class="w-full premium-bg text-white p-4 rounded-xl font-bold text-lg hover:opacity-90 shadow-lg mt-4">
                צפה בתיק המשכנתא
            </button>
            <div id="error-msg" class="text-red-500 text-center font-bold hidden mt-4">הפרטים שגויים. אנא נסה שנית.</div>
        </div>
    </div>

    <!-- מסך תצוגת הנתונים (מוסתר בהתחלה) -->
    <div id="client-dashboard" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative">
        <div class="premium-bg p-10 text-center text-white relative">
            <h1 class="text-4xl font-extrabold mb-2">שלום, <span id="display-name" class="gold-accent"></span></h1>
            <p class="opacity-80">זהו סיכום האבחון הפיננסי שלך</p>
        </div>
        
        <div class="p-10 text-center">
            <h2 class="text-gray-500 font-bold mb-4">תקציב רכישה מאושר (הערכה)</h2>
            <div class="text-7xl font-extrabold premium-text tracking-tight mb-8">
                ₪<span id="display-budget">0</span>
            </div>
            
            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 text-right mb-8">
                <h3 class="font-bold text-blue-900 text-lg mb-2">הצעד הבא שלך:</h3>
                <p class="text-gray-700">התיק שלך ממתין לאישור מסמכים. לטובת התקדמות והוצאת אישור עקרוני רשמי, אנא צור קשר עם היועץ להשלמת התהליך.</p>
            </div>

            <button onclick="window.print()" class="bg-gray-100 text-gray-800 border border-gray-300 p-4 rounded-xl font-bold hover:bg-gray-200 transition w-full">
                🖨️ הדפס סיכום
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3HXAMF-N-KyAat6Jq7RwR_uSVk3WqILA",
            authDomain: "frid-db.firebaseapp.com",
            projectId: "frid-db",
            storageBucket: "frid-db.firebasestorage.app",
            messagingSenderId: "644587019949",
            appId: "1:644587019949:web:ed71afabd57efac6d73024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.fetchClientData = async () => {
            const phone = document.getElementById('loginPhone').value.trim();
            const docId = document.getElementById('loginCode').value.trim();

            if (!phone || !docId) {
                alert("נא להזין טלפון וקוד תיק");
                return;
            }

            try {
                // הבאת המסמך הספציפי מהדטבייס
                const docRef = doc(db, "clients", docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // בדיקת אבטחה בסיסית - האם הטלפון תואם
                    if (data.phone === phone) {
                        // הצלחה! מעבר למסך התצוגה
                        document.getElementById('client-login').classList.add('hidden');
                        document.getElementById('client-dashboard').classList.remove('hidden');
                        
                        document.getElementById('display-name').textContent = data.name;
                        document.getElementById('display-budget').textContent = data.budget;
                    } else {
                        showError();
                    }
                } else {
                    showError();
                }
            } catch (error) {
                console.error("Error fetching document:", error);
                showError();
            }
        };

        function showError() {
            document.getElementById('error-msg').classList.remove('hidden');
        }
    </script>
</body>
</html>
